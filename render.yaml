services:
  - type: web
    name: trading-ai-workspace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: cron
    name: screener-refresh
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    schedule: "0 21 * * 1-5"
    startCommand: python scripts/generate_screener.py
