name: Update Stock Screener

on:
  schedule:
    - cron: '0 15 * * 1-5'  # Monday-Friday at 15:00 UTC (10:00 ET / 11:00 EDT)
  workflow_dispatch:  # Manual trigger

jobs:
  update-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Generate screener
        run: python scripts/generate_screener.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add stock_screener.html
          git diff --staged --quiet || git commit -m "Auto-update screener $(date +%Y-%m-%d)"
          git push
