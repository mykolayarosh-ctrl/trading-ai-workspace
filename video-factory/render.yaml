services:
  - type: web
    name: video-factory
    env: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PEXELS_API_KEY
        sync: false
      - key: PORT
        value: 5000
    disk:
      name: video-storage
      mountPath: /output
      sizeGB: 1
